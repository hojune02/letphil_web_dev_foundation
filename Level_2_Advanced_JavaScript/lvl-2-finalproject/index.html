<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <nav>
        <button id="weatherBtn" class="navBtn" data-page="weatherPage">
            Weather
        </button>
        <button id="todoBtn" class="navBtn" data-page="todoPage">
            To-do list
        </button>
        <button id="notesBtn" class="navBtn" data-page="notesPage">
            Notes
        </button>
    </nav>

    <section id="weatherPage" class="page">
        <h2>Weather</h2>
        <div id="weatherPanel">
            <label for="city">Your city:</label>
            <input type="text" id="cityInput" placeholder="Your city...">
            <button id="cityBtn">Submit</button>
            <div id="weatherStatus"></div>
        </div>
    </section>

    <section id="todoPage" class="page">
        <h2>To-do List</h2>

        <div id="todolistPanel">
            <input type="text" id="task" placeholder="Your task...">
            <button id="taskBtn">Submit</button>
        </div>

        <ul id="todos">

        </ul>
    </section>

    <section id="notesPage" class="page">
        <h2>Notes</h2>

        <div id="notesPanel">
            <label for="noteTitle">Title</label>
            <input type="text" id="noteTitle" placeholder="Your title..." required>
            <br>
            <label for="noteTitle">Content</label>
            <input type="text" id="noteContent" placeholder="Your note..." required>
            <br>
            <button id="noteBtn">Submit</button>
        </div>

        <h3>Your Notes</h3>
        <ul id="notes">

        </ul>
    </section>

    <script src="./script.js"></script>
</body>
</html>
